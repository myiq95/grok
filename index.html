<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="세련된 프리미엄 독서 앱 - 서재. TXT, DOCX, PDF, EPUB, MD, HTML 지원. 오프라인 가능.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="서재">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>서재 · Premium Reader</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">불러오는 중...</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ===== HOME SCREEN ===== -->
  <div class="screen active" id="home-screen">
    <header class="home-header">
      <h1>서재</h1>
      <p>당신의 책을 아름답게</p>
    </header>

    <div class="home-actions">
      <button class="action-btn primary" id="btn-open-file">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        파일 열기
      </button>
      <button class="action-btn" id="btn-paste-text">
        <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        텍스트 붙여넣기
      </button>
    </div>

    <section class="library-section">
      <h2 class="section-title">내 서재</h2>
      <div class="library-grid" id="library-grid">
        <!-- Books injected here -->
      </div>
      <div class="empty-library" id="empty-library" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <p>아직 책이 없습니다.<br>파일을 열거나 텍스트를 붙여넣어 시작하세요.</p>
      </div>
    </section>
  </div>

  <!-- ===== READER SCREEN ===== -->
  <div class="screen" id="reader-screen">
    <article class="reader-content" id="reader-content">
      <!-- Content injected -->
    </article>

    <!-- Island Bar -->
    <nav class="island-bar" id="island-bar">
      <button class="island-btn" id="btn-home" title="서재">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button class="island-btn" id="btn-toc" title="목차">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <div class="island-divider"></div>
      <button class="island-btn" id="btn-tts" title="읽어주기">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="island-btn" id="btn-settings" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- TOC Panel -->
  <aside class="side-panel" id="toc-panel">
    <div class="panel-header">
      <h2>목차</h2>
      <button class="panel-close" id="toc-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <ul class="toc-list" id="toc-list"></ul>
    </div>
  </aside>

  <!-- Settings Panel -->
  <aside class="side-panel" id="settings-panel">
    <div class="panel-header">
      <h2>읽기 설정</h2>
      <button class="panel-close" id="settings-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <!-- Theme -->
      <div class="setting-group">
        <div class="setting-label">테마</div>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="light">
            <div class="theme-preview"></div>
            라이트
          </button>
          <button class="theme-btn" data-theme="sepia">
            <div class="theme-preview"></div>
            세피아
          </button>
          <button class="theme-btn" data-theme="dark">
            <div class="theme-preview"></div>
            나이트
          </button>
        </div>
      </div>

      <!-- Font -->
      <div class="setting-group">
        <div class="setting-label">글꼴</div>
        <div class="font-options">
          <button class="font-btn active" data-font="'Noto Serif KR', Georgia, serif">본명조</button>
          <button class="font-btn" data-font="'Noto Sans KR', sans-serif">본고딕</button>
          <button class="font-btn" data-font="'Nanum Myeongjo', serif">나눔명조</button>
          <button class="font-btn" data-font="Georgia, 'Times New Roman', serif">Georgia</button>
          <button class="font-btn" data-font="'Courier New', monospace">고정폭</button>
        </div>
      </div>

      <!-- Font Size -->
      <div class="setting-group">
        <div class="setting-label">글자 크기</div>
        <div class="slider-control">
          <input type="range" id="font-size-slider" min="14" max="32" value="18" step="1">
          <span class="slider-value" id="font-size-value">18</span>
        </div>
      </div>

      <!-- Line Height -->
      <div class="setting-group">
        <div class="setting-label">줄 간격</div>
        <div class="slider-control">
          <input type="range" id="line-height-slider" min="1.4" max="2.4" value="1.85" step="0.05">
          <span class="slider-value" id="line-height-value">1.85</span>
        </div>
      </div>

      <!-- Letter Spacing -->
      <div class="setting-group">
        <div class="setting-label">자간</div>
        <div class="slider-control">
          <input type="range" id="letter-spacing-slider" min="-0.02" max="0.12" value="0.02" step="0.01">
          <span class="slider-value" id="letter-spacing-value">0.02</span>
        </div>
      </div>

      <!-- Max Width -->
      <div class="setting-group">
        <div class="setting-label">본문 너비</div>
        <div class="slider-control">
          <input type="range" id="max-width-slider" min="500" max="900" value="720" step="20">
          <span class="slider-value" id="max-width-value">720</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Paste Modal -->
  <div class="modal" id="paste-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>텍스트 붙여넣기</h3>
        <button class="panel-close" id="paste-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="text" id="paste-title" placeholder="제목 (선택사항)" maxlength="100">
        <textarea id="paste-content" placeholder="여기에 텍스트를 붙여넣으세요..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="paste-cancel">취소</button>
        <button class="btn btn-primary" id="paste-confirm">읽기 시작</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" accept=".txt,.md,.markdown,.html,.htm,.docx,.pdf,.epub,text/plain,text/markdown,text/html,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

  <!-- Scripts: Core libraries via CDN (cached by SW) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  
  <script src="js/db.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/toc.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
